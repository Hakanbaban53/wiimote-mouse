[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wiimote-mouse"
dynamic = ["version"]
description = "Use a Wii Remote with MotionPlus as a gyro mouse on Linux"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hakanbaban53" }]
keywords = ["wii", "wiimote", "gyro", "air-mouse", "evdev", "uinput", "linux", "gtk4", "libadwaita"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = [
    "evdev>=1.6",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
# The UI also needs GTK 4, libadwaita and librsvg from your distribution; PyGObject is easiest to
# get from there too (see the README), so this extra is mostly documentation.
ui = ["PyGObject>=3.46"]

[project.scripts]
wiimote-mouse = "wiimote_mouse.daemon:main"
wiimotectl = "wiimote_mouse.ctl:main"
wiimote-mouse-ui = "wiimote_mouse.ui.launch:main"

[project.urls]
Homepage = "https://github.com/Hakanbaban53/wiimote-mouse"
Source = "https://github.com/Hakanbaban53/wiimote-mouse"
Issues = "https://github.com/Hakanbaban53/wiimote-mouse/issues"
Changelog = "https://github.com/Hakanbaban53/wiimote-mouse/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "wiimote_mouse.__version__" }

[tool.setuptools.packages.find]
include = ["wiimote_mouse*"]
