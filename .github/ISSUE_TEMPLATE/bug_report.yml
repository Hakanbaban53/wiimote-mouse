name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The two outputs below (`--doctor` and the log) answer most questions before they are asked.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Press a button on the remote ..."
  - type: textarea
    id: doctor
    attributes:
      label: Output of `wiimote-mouse --doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log (`journalctl --user -u wiimote-mouse -n 100 --no-pager`)
      render: text
  - type: input
    id: version
    attributes:
      label: Version (`wiimote-mouse --version`)
    validations:
      required: true
  - type: dropdown
    id: remote
    attributes:
      label: Remote
      options:
        - Wii Remote Plus (MotionPlus built in)
        - Wii Remote + MotionPlus adapter
        - Wii Remote without MotionPlus
        - Other
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and desktop (for example CachyOS, GNOME on Wayland)
    validations:
      required: true
